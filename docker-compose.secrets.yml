# Optional overlay: the operator creates this directory and supplies the nonsecret catalog.
# Missing files inside the read-only mount remain diagnosable from Bootstrap.
services:
  backend:
    volumes:
      - type: bind
        source: ${EDUAGENT_SECRETS_DIRECTORY:?Explicit Secret directory required}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
