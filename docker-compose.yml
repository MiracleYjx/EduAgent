name: eduagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduagent}
      POSTGRES_USER: ${POSTGRES_USER:-eduagent}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${EDUAGENT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eduagent}@postgres:5432/${POSTGRES_DB:-eduagent}
      REDIS_URL: redis://redis:6379/0
      # Demo 明确使用已有云端适配器；与主机开发的本地 BGE 配置分离。
      # 空值不回退到主机模型/密钥，启动检查会明确报告缺失配置。
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: ${DEMO_EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${DEMO_EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${DEMO_EMBEDDING_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # 启动命令统一使用 Dockerfile CMD（Embedding 配置检查后启动 uvicorn）。
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
