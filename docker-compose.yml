name: eduagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduagent}
      POSTGRES_USER: ${POSTGRES_USER:-eduagent}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # --env-file is an explicit interpolation source, never an unrestricted app env_file.
    environment:
      EDUAGENT_ENVIRONMENT: ${EDUAGENT_ENVIRONMENT:-development}
      EDUAGENT_RUNTIME_KIND: docker
      EDUAGENT_DATA_ROOT: /app/storage
      EDUAGENT_PUBLIC_PORT: ${BACKEND_PORT:-8000}
      EDUAGENT_SECRET_BACKEND: mounted_secret
      EDUAGENT_SECRET_MOUNTS: ${EDUAGENT_SECRET_MOUNTS:-}
      STORAGE_ROOT: /app/storage/storage
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eduagent}@postgres:5432/${POSTGRES_DB:-eduagent}
      REDIS_URL: redis://redis:6379/0
      DEV_MODE: ${DEV_MODE:-false}
      # Explicit opt-in for the QuickStart controlled restart; Compose restarts the container.
      EDUAGENT_CONTAINER_RESTART: ${EDUAGENT_CONTAINER_RESTART:-1}
      GRADIO_ANALYTICS_ENABLED: "false"
    volumes:
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Setup remains available while /ready is 503; unhealthy is not a restart policy.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  storage_data:
